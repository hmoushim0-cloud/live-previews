<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#0f172a" rx="40"/>
  <text x="35" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">09:41</text>
  <rect x="145" y="16" width="100" height="18" rx="9" fill="#000000"/>
  <text x="325" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">5G 100%</text>

  <!-- Header -->
  <text x="350" y="85" text-anchor="end" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">تفاصيل السلة والطلب</text>
  <circle cx="45" cy="80" r="16" fill="#1e293b"/>
  <text x="45" y="85" text-anchor="middle" fill="#ffffff" font-size="14">‹</text>

  <!-- Big Hero Image -->
  <rect x="25" y="115" width="340" height="180" rx="24" fill="#1e293b"/>
  <text x="195" y="215" text-anchor="middle" font-size="70">🌟</text>

  <!-- Product Details Card -->
  <rect x="25" y="315" width="340" height="240" rx="20" fill="#1e293b"/>
  <text x="340" y="350" text-anchor="end" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">عطور النخبة</text>
  <text x="340" y="375" text-anchor="end" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="bold">149 ر.س شامل الضريبة</text>
  <text x="340" y="410" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="12">خيارات الطلب والتخصيص:</text>
  
  <rect x="235" y="430" width="105" height="32" rx="8" fill="#6366f1"/>
  <text x="287" y="451" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">توصيل سريع</text>
  <rect x="115" y="430" width="105" height="32" rx="8" fill="#334155"/>
  <text x="167" y="451" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">استلام من الفرع</text>

  <!-- Quantity counter -->
  <rect x="120" y="490" width="150" height="40" rx="20" fill="#0f172a"/>
  <circle cx="140" cy="510" r="14" fill="#334155"/>
  <text x="140" y="515" text-anchor="middle" fill="#ffffff" font-size="16">-</text>
  <text x="195" y="515" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
  <circle cx="250" cy="510" r="14" fill="#6366f1"/>
  <text x="250" y="515" text-anchor="middle" fill="#ffffff" font-size="16">+</text>

  <!-- Add to Cart CTA -->
  <rect x="25" y="700" width="340" height="56" rx="18" fill="#6366f1"/>
  <text x="195" y="735" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">تأكيد وإضافة للسلة 🛍️</text>
</svg>